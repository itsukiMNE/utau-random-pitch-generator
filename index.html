<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UTAU Random Pitch Generator v1.14</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="header-top">
        <div>
          <h1>UTAU Random Pitch Generator</h1>
          <p class="subtitle" id="subtitle">为多音阶UTAU音源提供随机音阶建议</p>
        </div>
        <div class="language-switcher" aria-label="Language">
          <button class="language-button active" data-lang="zh">中文</button>
          <button class="language-button" data-lang="ja">日本語</button>
          <button class="language-button" data-lang="en">English</button>
        </div>
      </div>
    </header>

    <!-- v1.14: Two-column workspace on desktop; controls stay on the left. -->
    <div class="workspace">
      <div class="controls-column">
    <section class="group">
      <div class="group-title" id="genderTitle">Gender</div>
      <div class="options">
        <div class="option">
          <input type="radio" id="male" name="gender" value="male">
          <label for="male" id="maleLabel">Male</label>
        </div>
        <div class="option">
          <input type="radio" id="female" name="gender" value="female" checked>
          <label for="female" id="femaleLabel">Female</label>
        </div>
      </div>
    </section>

    <section class="group">
      <div class="group-title" id="pitchCountTitle">Number of Pitches</div>
      <div class="options">
        <div class="option">
          <input type="radio" id="count2" name="pitchCount" value="2">
          <label for="count2">2</label>
        </div>
        <div class="option">
          <input type="radio" id="count3" name="pitchCount" value="3" checked>
          <label for="count3">3</label>
        </div>
        <div class="option">
          <input type="radio" id="count4" name="pitchCount" value="4">
          <label for="count4">4</label>
        </div>
      </div>
    </section>

    <section class="group">
      <label class="check-row">
        <input type="checkbox" id="avoidSharps">
        <span id="avoidSharpsLabel">Avoid sharps (#)</span>
      </label>
    </section>

    <section class="preview" aria-live="polite">
      <div class="preview-title" id="generatedPitchesTitle">Generated Pitches</div>
      <div class="pitch-result" id="pitchResult">—</div>
    </section>

    <div class="folder-options">
      <label class="check-row">
        <input type="checkbox" id="addNumbers">
        <span id="addNumbersLabel">Add numbers when creating folders (e.g. 01_C4, 02_E4...)</span>
      </label>
    </div>

    <div class="buttons">
      <button class="primary" id="generateButton">Generate</button>
      <button class="secondary" id="confirmButton" disabled>Confirm &amp; Create Folders</button>
    </div>

    <div class="message" id="message"></div>

    </div>
    <!-- v1.14: Move the existing history into the desktop right column. -->
    <section class="history" aria-label="Pitch history">
      <div class="history-header">
        <div class="group-title" id="historyTitle">历史记录（最近 20 条）</div>
        <button class="history-clear" id="clearHistoryButton" type="button">清空</button>
      </div>
      <div class="history-list" id="historyList"></div>
    </section>
    </div>

    <footer>v1.14: 2–4 Pitches / Gender Range / Avoid Sharps / Folder Numbering / History<br>UTAU Random Pitch Generator · by itsukiMNE</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
